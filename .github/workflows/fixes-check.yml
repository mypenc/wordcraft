# Verifies the combined fixes branch builds and passes tests. Integration branch only; not part of the PRs.
name: Fixes check

on:
  push:
    branches: [all-fixes-integration]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (engine, ui-egui)
        run: cargo clippy -p wordcraft-engine -p wordcraft-ui-egui --all-targets -- -D warnings

      - name: Engine tests
        run: cargo test -p wordcraft-engine

      - name: UI tests
        run: cargo test -p wordcraft-ui-egui
