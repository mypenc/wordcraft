# Verifies the combined fixes branch builds and passes tests. Integration branch only; not part of the PRs.
name: Fixes check

on:
  push:
    branches: [all-fixes-integration]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (engine, ui-egui)
        run: cargo clippy -p wordcraft-engine -p wordcraft-ui-egui --all-targets -- -D warnings

      - name: Engine tests
        run: |
          set -o pipefail
          cargo test -p wordcraft-engine --no-fail-fast 2>&1 | tee engine-tests.log

      - name: UI tests
        if: always()
        run: |
          set -o pipefail
          cargo test -p wordcraft-ui-egui --no-fail-fast 2>&1 | tee ui-tests.log

      - name: Publish test summaries to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/out
          for f in engine-tests ui-tests; do
            [ -f $f.log ] || continue
            grep -E "^test .* (FAILED|failed)|panicked at|^failures:|test result:|^error|^warning: unused" -A6 $f.log | head -400 > /tmp/out/$f-summary.txt || true
            tail -60 $f.log > /tmp/out/$f-tail.txt
          done
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout --orphan ci-logs-new
          git rm -rf -q . || true
          cp /tmp/out/* .
          git add -A
          git commit -q -m "CI logs for ${GITHUB_SHA}"
          git push -f origin HEAD:ci-logs
