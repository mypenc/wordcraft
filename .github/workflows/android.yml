name: Android release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# A newer push cancels the older run on the same branch.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NDK_VERSION: "26.3.11579264"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust 1.95 with Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: aarch64-linux-android

      # Caches ~/.cargo registry + git and the target/ dir (compiled dependencies).
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-${{ hashFiles('android/scripts/vendor-winit.sh', 'android/patches/*.patch') }}
          cache-all-crates: true
          # Save the cache even if a later step (e.g. Gradle) fails, so Rust is never rebuilt for nothing.
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      # Prebuilt binary: avoids compiling cargo-ndk from source on every run.
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}"

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Caches Gradle downloads and the wrapper distribution.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Step 1: Rust only. Finishes (and its cache is saved) independently of Gradle.
      - name: Build Rust library (arm64-v8a)
        run: |
          chmod +x android/scripts/build.sh
          android/scripts/build.sh --no-apk

      # Step 2: package the APK.
      - name: Build release APK
        working-directory: android
        run: |
          if [ -x ./gradlew ]; then ./gradlew assembleRelease; else gradle assembleRelease; fi

      # Release APKs from Gradle are unsigned and Android refuses to install them
      # ("package appears to be invalid"). Align + sign with apksigner.
      - name: Align and sign APK
        id: apk
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "Unsigned APK: $UNSIGNED"
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No keystore secrets set; signing with a throwaway key. Each build gets a different signature, so uninstall the old app before installing a new build."
            KS_PASS=android; KS_ALIAS=wordcraft
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=WordCraft"
          fi
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          OUT=android/app/build/outputs/apk/release/wordcraft-arm64-signed.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"
          unzip -l "$OUT" | grep '\.so'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-arm64
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
